workflow:
  entry: start1
  allow_parallel: true
  nodes:
    finish:
      backend: claude
      prompt: prompts/finish.md
      output_schema: schemas/finish-result.json
      session_policy: new
      position_x: 1360
      position_y: -575
      sandbox: workspace-write
      approval: on-request
      effort: low
    plan:
      backend: codex
      model: gpt-5.5
      prompt: prompts/plan.md
      output_schema: schemas/plan-result.json
      session_policy: resume
      position_x: 807.41
      position_y: -811.93
      sandbox: read-only
      approval: never
      effort: medium
      tools:
        - shell
    review:
      backend: codex
      model: gpt-5.5
      prompt: prompts/review.md
      output_schema: schemas/review-result.json
      session_policy: resume
      position_x: 1140
      position_y: -180
      sandbox: danger-full-access
      approval: never
      effort: medium
      tools:
        - shell
    start1:
      backend: claude
      prompt: prompts/start1.md
      output_schema: schemas/start1-result.json
      session_policy: new
      position_x: 250
      position_y: -590
      sandbox: read-only
      approval: never
      effort: low
    work:
      backend: codex
      model: gpt-5.5
      prompt: prompts/work.md
      output_schema: schemas/work-result.json
      session_policy: new
      position_x: 569.45
      position_y: -171.19
      sandbox: danger-full-access
      approval: never
      effort: high
      tools:
        - Bash
        - Read
        - Write
        - Edit
        - shell
  edges:
    - from: start1
      when: "decision == 'PASS'"
      to: plan
      input: '{{source.handoffPrompt}}'
    - from: plan
      when: "decision == 'PASS'"
      to: work
      input: 'Selected Work session policy: {{source.targetSessionPolicy}}\n\n{{source.handoffPrompt}}'
      target_session: source
      target_model: gpt-5.5
      target_prompt: You are Work in plan-dispatched mode. Implement or prepare exactly the bounded task in Runtime Input. Respect the selected Work session policy described in Runtime Input; new means a clean independent boundary, resume means continue the previous Work context without starting another task. Keep one logical boundary, edit only allowed files, run the requested proof when practical, and do not start another task. If Runtime Input is commit-prep, prepare the exact commit candidate for Review, verify scope and checks, but do not stage or commit. Review owns final accept-and-commit. Return PASS when ready for Review, REVISE with an exact Work-fixable blocker, or BLOCKED when Plan must approve a scope or sequencing decision. Return JSON only.
    - from: work
      when: "decision == 'PASS'"
      to: review
      input: '{{source.handoffPrompt}}'
      target_session: follow
    - from: work
      when: "decision == 'BLOCKED'"
      to: plan
      input: '{{source.handoffPrompt}}'
      target_session: resume
      target_model: gpt-5.5
      target_prompt: >-
    - from: review
      when: "decision == 'REVISE'"
      to: work
      input: '{{source.handoffPrompt}}'
      target_session: resume
      target_prompt: >-
    - from: review
      when: "decision == 'BLOCKED'"
      to: plan
      input: '{{source.handoffPrompt}}'
      target_session: resume
      target_model: gpt-5.5
      target_prompt: >-
    - from: review
      when: "decision == 'PASS'"
      to: plan
      input: '{{source.handoffPrompt}}'
      target_session: resume
      target_model: gpt-5.5
    - from: plan
      when: "decision == 'REVISE'"
      to: review
      input: '{{source.handoffPrompt}}'
      target_session: follow
      target_prompt: >-
    - from: plan
      when: "decision == 'FINISH'"
      to: finish
      input: '{{source.handoffPrompt}}'
